---
bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:

    use_sim_time: true

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugin: progress_checker

    goal_checker_plugins:
      - general_goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.30
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner

      debug_trajectory_details: true

      min_vel_x: 0.0
      max_vel_x: 0.5

      min_vel_y: 0.0
      max_vel_y: 0.0

      max_vel_theta: 1.2

      min_speed_xy: 0.0
      max_speed_xy: 0.5

      min_speed_theta: 0.0

      acc_lim_x: 1.0
      decel_lim_x: -1.0

      acc_lim_theta: 2.0
      decel_lim_theta: -2.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.2

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - RotateToGoal
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale: 0.15

      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.10

      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10

      PathDist.scale: 32.0
      GoalDist.scale: 24.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:

    use_sim_time: true

    expected_planner_frequency: 10.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner

      tolerance: 0.5

      use_astar: true

      allow_unknown: true

smoother_server:
  ros__parameters:

    use_sim_time: true

    smoother_plugins:
      - simple_smoother

    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      width: 6.0
      height: 6.0

      resolution: 0.05

      update_frequency: 10.0
      publish_frequency: 5.0

      robot_radius: 0.30

      plugins:
        - voxel_layer
        - inflation_layer

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer

        enabled: true
        publish_voxel_map: true

        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16

        max_obstacle_height: 2.5
        mark_threshold: 0

        observation_sources: depth_points

        depth_points:
          topic: /zed2i/zed_node/point_cloud/cloud_registered
          data_type: PointCloud2

          marking: true
          clearing: true

          obstacle_max_range: 5.0
          obstacle_min_range: 0.1

          raytrace_max_range: 6.0
          raytrace_min_range: 0.1

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

        inflation_radius: 0.50
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05

      update_frequency: 2.0
      publish_frequency: 1.0

      robot_radius: 0.30

      track_unknown_space: true

      plugins:
        - static_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer

        map_subscribe_transient_local: true

        map_topic: /map

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

        inflation_radius: 0.50
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

behavior_server:
  ros__parameters:

    use_sim_time: true

    global_frame: odom
    robot_base_frame: base_link

    transform_tolerance: 0.2

    cycle_frequency: 10.0

    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.3

    rotational_acc_lim: 2.0

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: nav2_behaviors/Spin

    backup:
      plugin: nav2_behaviors/BackUp

    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading

    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:

    use_sim_time: true

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:

    use_sim_time: true

    smoothing_frequency: 20.0

    scale_velocities: false

    feedback: OPEN_LOOP

    max_velocity: [0.5, 0.0, 1.2]
    min_velocity: [-0.5, 0.0, -1.2]

    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]

    odom_topic: /odom

    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

robot_state_publisher:
  ros__parameters:
    use_sim_time: true
